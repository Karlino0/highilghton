<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Highlight On — Editor</title><style>body{background:#171326;color:#eee8ff;font:16px system-ui;max-width:850px;margin:40px auto;padding:20px}a{color:#d4b4ff}form,article{background:#29223e;padding:20px;border-radius:14px;margin:15px 0}label{display:block;margin:12px 0}input,select,button{font:inherit;color:inherit;background:#39304f;border:1px solid #8873a9;border-radius:8px;padding:10px;box-sizing:border-box}input,select{width:100%}button{cursor:pointer;margin:4px}button:hover{background:#59447e}p{color:#c6bdd9}</style><a href="index.html">← Back to map</a><h1>Episode editor</h1><p>Edit your episode list, download episodes.json, then upload it to your GitHub repository. Nothing is published automatically. Do not add secret guests to the public repository.</p><p id="message" role="status">Loading…</p><form id="form"><label>Country<select id="country" required></select></label><label>Guest<input id="guest" required></label><label>Date<input id="date" type="date"></label><label>Status<select id="status"><option value="upcoming">Upcoming — gold</option><option value="completed">Completed — purple</option></select></label><label>VOD URL<input id="vod" type="url" placeholder="https://..."></label><button id="save" disabled>Save to draft</button><button type="button" id="cancel">New episode / cancel edit</button></form><button id="download" disabled>Download episodes.json</button> <a href="https://github.com/Karlino0/highlighton/upload/main" target="_blank" rel="noopener">Upload to GitHub ↗</a><div id="list"></div><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><script>const $=id=>document.getElementById(id);let episodes=[],edit=-1;function render(){$('list').replaceChildren();episodes.forEach((e,i)=>{let a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),b=document.createElement('button'),d=document.createElement('button');h.textContent=e.country+' — '+e.guest;p.textContent=(e.date||'TBA')+' · '+e.status;b.textContent='Edit';b.onclick=()=>{edit=i;$('country').value=e.id;$('guest').value=e.guest;$('date').value=e.date;$('status').value=e.status;$('vod').value=e.vod;$('save').textContent='Update draft';window.scrollTo(0,0)};d.textContent='Remove';d.onclick=()=>{if(confirm('Remove this episode from draft?')){episodes.splice(i,1);clear();render()}};a.append(h,p,b,d);$('list').append(a)})}function clear(){edit=-1;$('form').reset();$('save').textContent='Save to draft'}$('cancel').onclick=clear;$('form').onsubmit=e=>{e.preventDefault();let vod=$('vod').value.trim();if(vod&&!/^https:\/\//i.test(vod)){alert('Use an HTTPS VOD link');return}let row={id:$('country').value,country:$('country').selectedOptions[0].textContent,guest:$('guest').value.trim(),date:$('date').value,status:$('status').value,vod};if(!row.guest)return;if(edit<0)episodes.push(row);else episodes[edit]=row;clear();render();$('message').textContent='Draft updated. Download and upload to publish.'};$('download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(episodes,null,2)],{type:'application/json'}));a.download='episodes.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};async function init(){try{let [r,m]=await Promise.all([fetch('episodes.json',{cache:'no-store'}),fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')]);if(!r.ok||!m.ok)throw Error();episodes=await r.json();let data=await m.json(),f=topojson.feature(data,data.objects.countries).features.filter(d=>d.id&&d.properties.name!=='Antarctica').sort((a,b)=>a.properties.name.localeCompare(b.properties.name));for(let d of f){let o=document.createElement('option');o.value=String(d.id).padStart(3,'0');o.textContent=d.properties.name;$('country').append(o)}$('save').disabled=false;$('download').disabled=false;render();$('message').textContent='Published episodes loaded. Changes are drafts until uploaded.'}catch(e){$('message').textContent='Could not load data. Refresh and check your internet connection.'}}init();</script></html>
