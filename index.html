<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Highlight On...</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#392750,#101020 70%);color:#eee8ff;font:16px system-ui,sans-serif;min-height:100vh}main{max-width:1550px;margin:auto;padding:24px}header{text-align:center}h1{font-size:clamp(40px,6vw,76px);margin:8px;letter-spacing:-2px}small{letter-spacing:4px;color:#c5a9ef}p{color:#c6bdd9}a{color:#d6b9ff}button,input,select{font:inherit;color:#eee8ff;background:#302644;border:1px solid #79639e;padding:10px 14px;border-radius:9px}button{cursor:pointer}button:hover{background:#59447e}button:disabled{opacity:.5;cursor:wait}.stats{display:flex;justify-content:center;gap:clamp(20px,6vw,90px);text-align:center;margin:20px 0}.stats strong{display:block;font-size:32px;color:#d4b4ff}.track{height:8px;background:#39334e;border-radius:8px;overflow:hidden;margin-bottom:20px}.track div{height:100%;background:#b999f5;transition:width 1.4s}.mapwrap{position:relative}#map{width:100%;display:block;background:#151327;border:1px solid #51446e;border-radius:20px;touch-action:none}.country{fill:#37334f;stroke:#817695;stroke-width:.55;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .5s}.country:hover,.country:focus{fill:#8171a8;outline:none}.country.done{fill:#ad8bea}.country.upcoming{fill:#c69b51}.country.flash{stroke:#fff2ad;stroke-width:3;animation:flash .7s infinite alternate}@keyframes flash{to{fill:#fff4ba;filter:drop-shadow(0 0 12px gold)}}.panel{padding:20px;border:1px solid #51446e;border-radius:16px;margin:18px 0;background:#1d1931}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.episodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.episode{padding:18px;background:#29223e;border:1px solid #51446e;border-radius:12px}.episode h3{margin:0}.star{position:fixed;background:white;border-radius:50%;pointer-events:none;z-index:-1}.legend{display:flex;gap:18px;flex-wrap:wrap;color:#c6bdd9;font-size:14px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}footer{text-align:center;color:#aaa0bf;font-size:13px}#celebrate{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;overflow:hidden;border-radius:20px;background:#100b2444}#celebrate[hidden]{display:none}#big{font-size:clamp(30px,6vw,95px);font-weight:900;text-shadow:0 0 25px #d7a5ff,0 3px 10px #000}#sub{font-size:clamp(16px,2.5vw,35px);color:#fff0b4;text-shadow:0 2px 8px #000}#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}body.stream .archive,body.stream .intro,body.stream .editorlink,body.stream footer{display:none}body.stream main{max-width:1700px}body.stream .controls{opacity:.15}body.stream .controls:hover,body.stream .controls:focus-within{opacity:1}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><div id="stars"></div><main><header><small>THE LINO-VERSE PRESENTS</small><h1>Highlight On...</h1><p class="intro">Exploring the world, one guest at a time.</p></header><div class="stats"><div><strong id="count">0</strong>Countries explored</div><div><strong id="percent">0%</strong>World explored</div><div><strong id="remaining">195</strong>Remaining</div></div><div class="track"><div id="progress"></div></div><div class="mapwrap"><svg id="map" viewBox="0 0 1200 620" aria-label="Interactive world map"></svg><canvas id="confetti"></canvas><div id="celebrate" hidden><div id="big"></div><div id="sub"></div></div></div><p id="status" role="status">Loading map and episodes…</p><div class="legend"><span><i style="background:#37334f"></i>Unexplored</span><span><i style="background:#c69b51"></i>Upcoming</span><span><i style="background:#ad8bea"></i>Explored</span></div><div class="controls"><button id="reset">Reset zoom</button></div><div id="detail" class="panel">Select a country to explore.</div><section class="archive"><h2>Episode archive</h2><div id="episodes" class="episodes"></div></section><footer>195-country convention · Natural Earth / World Atlas</footer></main><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let episodes=[],preview=null,paths,svg,zoom,path,features=[],busy=false,shown=0,frame=0;const same=(a,b)=>+a===+b;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=e=>preview&&same(e.id,preview.id)?preview.status:e.status;const countryState=id=>episodes.some(e=>same(e.id,id)&&state(e)==='completed')?'completed':episodes.some(e=>same(e.id,id)&&state(e)==='upcoming')?'upcoming':'';function card(e){return `<h3>${esc(e.country)} — ${esc(e.guest)}</h3><p>${esc(e.date||'Date to be announced')} · ${state(e)==='completed'?'Explored':'Upcoming'}</p>${/^https:\/\//i.test(e.vod)?`<a href="${esc(e.vod)}" target="_blank" rel="noopener noreferrer">Watch episode ↗</a>`:'VOD coming soon'}`};function update(){let n=new Set(episodes.filter(e=>state(e)==='completed').map(e=>+e.id)).size;cancelAnimationFrame(frame);let start=shown,t=performance.now();function tick(now){let f=reduced?1:Math.min(1,(now-t)/1300);shown=start+(n-start)*f;$('count').textContent=Math.round(shown);$('percent').textContent=(shown/195*100).toFixed(2)+'%';$('remaining').textContent=195-Math.round(shown);if(f<1)frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick);$('progress').style.width=n/195*100+'%';$('episodes').innerHTML=episodes.map(e=>`<article class="episode">${card(e)}</article>`).join('');if(paths)paths.attr('class',d=>'country '+(countryState(d.id)==='completed'?'done':countryState(d.id)==='upcoming'?'upcoming':''))}function select(d){let es=episodes.filter(e=>same(e.id,d.id));$('detail').innerHTML=es.length?es.map(card).join('<hr>'):`<strong>${esc(d.properties.name)}</strong><p>Not explored yet.</p>`}for(let i=0;i<150;i++){let s=document.createElement('i');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:2px;height:2px;opacity:${Math.random()*.6}`;document.body.append(s)}const wait=ms=>new Promise(r=>setTimeout(r,ms));function reset(){return svg.transition().duration(reduced?0:1100).call(zoom.transform,d3.zoomIdentity).end().catch(()=>{})}async function init(){try{let r=await fetch('episodes.json',{cache:'no-store'});if(!r.ok)throw Error('Episode file missing');episodes=await r.json();update();let m=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');if(!m.ok)throw Error('Map download failed');let data=await m.json();features=topojson.feature(data,data.objects.countries).features.filter(d=>d.properties.name!=='Antarctica');svg=d3.select('#map');let projection=d3.geoNaturalEarth1().fitExtent([[20,20],[1180,600]],{type:'FeatureCollection',features});path=d3.geoPath(projection);let g=svg.append('g');zoom=d3.zoom().extent([[0,0],[1200,620]]).scaleExtent([1,18]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);paths=g.selectAll('path').data(features).join('path').attr('d',path).attr('tabindex',0).attr('aria-label',d=>d.properties.name).on('click',(e,d)=>{if(!busy)select(d)}).on('keydown',(e,d)=>{if(e.key==='Enter'&&!busy)select(d)});paths.append('title').text(d=>d.properties.name);update();$('status').textContent='Click a country · Scroll to zoom · Drag to move';$('reset').onclick=reset;}catch(e){$('status').textContent='Could not load website data. Check episodes.json and your internet connection.'}}init();</script></html>
